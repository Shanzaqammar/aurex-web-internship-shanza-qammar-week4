<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Shanza Qammar | AUREX Week 4</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h1 class="app-header__title">Task Manager</h1>
            <p class="app-header__subtitle">AUREX Week 4 — Shanza Qammar</p>
        </header>

        <div class="task-form">
            <input type="text" id="taskInput" class="task-form__input" placeholder="Add a new task..." maxlength="100">
            <button type="button" id="addTaskBtn" class="task-form__btn">Add Task</button>
        </div>

        <p class="validation-msg" id="validationMsg"></p>

        <div class="filters">
            <button class="filters__btn filters__btn--active" data-filter="all">All</button>
            <button class="filters__btn" data-filter="active">Active</button>
            <button class="filters__btn" data-filter="completed">Completed</button>
        </div>

        <div class="task-counter">
            <span id="taskCount">0 tasks</span>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="empty-state" id="emptyState">
            <p class="empty-state__text">No tasks yet. Add your first task above! 🚀</p>
        </div>

        <footer class="app-footer">
            <p>&copy; 2026 Shanza Qammar | AUREX Full-Stack Internship</p>
        </footer>
    </div>

    <script>
    var taskInput = document.getElementById('taskInput');
    var validationMsg = document.getElementById('validationMsg');
    var taskList = document.getElementById('taskList');
    var taskCount = document.getElementById('taskCount');
    var emptyState = document.getElementById('emptyState');
    var filterButtons = document.querySelectorAll('.filters__btn');
    var addTaskBtn = document.getElementById('addTaskBtn');

    var tasks = [];
    var currentFilter = 'all';

    function saveTasksToStorage() {
        localStorage.setItem('shanzaTasks', JSON.stringify(tasks));
    }

    function loadTasksFromStorage() {
        var storedTasks = localStorage.getItem('shanzaTasks');
        tasks = storedTasks ? JSON.parse(storedTasks) : [];
    }

    function showValidationMessage(message) {
        validationMsg.textContent = message;
        setTimeout(function() { validationMsg.textContent = ''; }, 3000);
    }

    function addTask(taskText) {
        tasks.push({
            id: Date.now(),
            text: taskText.trim(),
            completed: false
        });
        saveTasksToStorage();
        renderTasks();
    }

    function deleteTask(taskId) {
        tasks = tasks.filter(function(task) { return task.id !== taskId; });
        saveTasksToStorage();
        renderTasks();
    }

    function toggleComplete(taskId) {
        tasks = tasks.map(function(task) {
            if (task.id === taskId) {
                return { id: task.id, text: task.text, completed: !task.completed };
            }
            return task;
        });
        saveTasksToStorage();
        renderTasks();
    }

    function editTask(taskId) {
        var task = tasks.find(function(t) { return t.id === taskId; });
        if (!task) return;
        var newText = prompt('Edit your task:', task.text);
        if (newText === null) return;
        if (newText.trim() === '') {
            showValidationMessage('Task cannot be empty.');
            return;
        }
        tasks = tasks.map(function(t) {
            if (t.id === taskId) {
                return { id: t.id, text: newText.trim(), completed: t.completed };
            }
            return t;
        });
        saveTasksToStorage();
        renderTasks();
    }

    function getFilteredTasks() {
        if (currentFilter === 'active') return tasks.filter(function(t) { return !t.completed; });
        if (currentFilter === 'completed') return tasks.filter(function(t) { return t.completed; });
        return tasks;
    }

    function renderTasks() {
        var filteredTasks = getFilteredTasks();
        taskList.innerHTML = '';

        if (filteredTasks.length === 0) {
            emptyState.classList.remove('empty-state--hidden');
        } else {
            emptyState.classList.add('empty-state--hidden');
        }

        filteredTasks.forEach(function(task) {
            var li = document.createElement('li');
            li.className = 'task-item' + (task.completed ? ' task-item--completed' : '');

            var checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'task-item__checkbox';
            checkbox.checked = task.completed;
            checkbox.addEventListener('change', function() { toggleComplete(task.id); });

            var span = document.createElement('span');
            span.className = 'task-item__text';
            span.textContent = task.text;

            var actions = document.createElement('div');
            actions.className = 'task-item__actions';

            var editBtn = document.createElement('button');
            editBtn.className = 'task-item__btn task-item__btn--edit';
            editBtn.textContent = 'Edit';
            editBtn.addEventListener('click', function() { editTask(task.id); });

            var deleteBtn = document.createElement('button');
            deleteBtn.className = 'task-item__btn task-item__btn--delete';
            deleteBtn.textContent = 'Delete';
            deleteBtn.addEventListener('click', function() { deleteTask(task.id); });

            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(actions);

            taskList.appendChild(li);
        });
        updateTaskCount();
    }

    function updateTaskCount() {
        var total = tasks.length;
        var completed = tasks.filter(function(t) { return t.completed; }).length;
        taskCount.textContent = total + ' task' + (total !== 1 ? 's' : '') + ' (' + completed + ' completed)';
    }

    function handleAddTask() {
        var taskText = taskInput.value.trim();
        if (taskText === '') {
            showValidationMessage('Please enter a task before adding.');
            return;
        }
        if (taskText.length > 100) {
            showValidationMessage('Task is too long (max 100 characters).');
            return;
        }
        addTask(taskText);
        taskInput.value = '';
        taskInput.focus();
    }

    addTaskBtn.onclick = handleAddTask;

    filterButtons.forEach(function(button) {
        button.addEventListener('click', function() {
            filterButtons.forEach(function(btn) { btn.classList.remove('filters__btn--active'); });
            button.classList.add('filters__btn--active');
            currentFilter = button.dataset.filter;
            renderTasks();
        });
    });

    function initApp() {
        loadTasksFromStorage();
        renderTasks();
    }

    initApp();
    </script>
</body>
</html>
